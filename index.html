function renderFootprints() {

  const list = document.getElementById('footprintList');

  list.innerHTML = '';



  const isDraft = f => f.name === '新地点' || f.name === '地点';



  const visited = footprints.filter(f => f.type === 'visited' && !isDraft(f));

  const upcoming = footprints.filter(f => f.type === 'upcoming' && !isDraft(f));

  const projects = footprints.filter(f => f.type === 'project' && !isDraft(f));

  const wishlist = footprints.filter(f => f.type === 'wishlist' && !isDraft(f));

  const completed = footprints.filter(f => f.type === 'completed' && !isDraft(f));



  if (visited.length === 0 && upcoming.length === 0 && projects.length === 0 && wishlist.length === 0 && completed.length === 0) {

    list.innerHTML = '<div style="padding:30px;text-align:center;color:rgba(255,255,255,0.2);font-size:13px;">还没有足迹<br>搜索地点或点击地图开始记录 ✨</div>';

    return;

  }



  if (!window.sectionCollapsed) {

    window.sectionCollapsed = { project: true, upcoming: true, visited: true, wishlist: true, completed: true };

  }



  if (projects.length > 0) {

    renderSection(list, 'project', '🔴 近期项目', projects, 'project-title');

  }



  if (upcoming.length > 0) {

    renderSection(list, 'upcoming', '🟡 CGC项目', upcoming, 'upcoming-title');

  }



  if (wishlist.length > 0) {

    renderSection(list, 'wishlist', '🌟 想去', wishlist, 'wishlist-title');

  }



  if (completed.length > 0) {

    renderSection(list, 'completed', '✅ 完成项目', completed, 'completed-title');

  }



  // 已去过：默认锁定，需密码 5215181 解锁

  if (visited.length > 0 && window.visitedUnlocked) {

    renderSection(list, 'visited', '📍 已去过', visited, 'visited-title');

  }

  // 始终显示已去过入口（锁定状态也显示，便于解锁）

  if (visited.length > 0 && !window.visitedUnlocked) {

    renderLockedSection(list, 'visited', '📍 已去过', visited.length);

  }

}



function renderSection(list, type, titleText, items, titleClass) {

  const isHidden = window.hiddenTypes?.has(type);

  const title = document.createElement('div');

  title.className = `list-section-title ${titleClass} ${window.sectionCollapsed?.[type] ? 'collapsed' : ''}`;

  title.innerHTML = `${titleText} <span class="section-count">${items.length}</span><button class="visibility-toggle ${isHidden ? 'hidden' : ''}" title="${isHidden ? '显示地图标注' : '隐藏地图标注'}" onclick="event.stopPropagation(); toggleTypeVisibility('${type}');">${isHidden ? '<span style="display:inline-block;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.25);padding:1px 7px;border-radius:3px;font-size:10px;font-weight:500;letter-spacing:0.5px;">隐藏</span>' : '<span style="display:inline-block;background:rgba(0,212,255,0.12);color:rgba(0,212,255,0.85);padding:1px 7px;border-radius:3px;font-size:10px;font-weight:500;letter-spacing:0.5px;">可见</span>'}</button><span class="collapse-icon">▼</span>`;

  list.appendChild(title);



  const section = document.createElement('div');

  section.className = `footprint-list-section ${window.sectionCollapsed?.[type] ? 'collapsed' : ''}`;

  section.dataset.type = type;



  const displayItems = [...items].reverse();

  const maxDisplay = 5;

  const visibleItems = displayItems.slice(0, maxDisplay);

  const hiddenCount = displayItems.length - maxDisplay;



  visibleItems.forEach((fp, idx) => {

    section.appendChild(createFootprintCard(fp, displayItems.length - idx));

  });



  if (hiddenCount > 0) {

    const expandBtn = document.createElement('div');

    expandBtn.className = 'expand-more-btn';

    expandBtn.innerHTML = `展开 ${hiddenCount} 个更多 ▼`;

    expandBtn.addEventListener('click', () => {

      expandBtn.remove();

      displayItems.slice(maxDisplay).forEach((fp, idx) => {

        section.appendChild(createFootprintCard(fp, displayItems.length - idx - maxDisplay));

      });

    });

    section.appendChild(expandBtn);

  }



  list.appendChild(section);



  title.addEventListener('click', () => {

    const isCollapsed = section.classList.toggle('collapsed');

    title.classList.toggle('collapsed', isCollapsed);

    if (!window.sectionCollapsed) window.sectionCollapsed = {};

    window.sectionCollapsed[type] = isCollapsed;

  });

}

// 锁定状态的足迹分组（点击需输入密码解锁）

function renderLockedSection(list, type, titleText, count) {

  const title = document.createElement('div');

  title.className = 'list-section-title visited-title locked';

  title.innerHTML = `${titleText} <span style="color:var(--text-muted);font-size:11px;">🔒 已锁定</span> <span class="section-count" style="background:rgba(255,255,255,0.05);">${count}</span><span class="collapse-icon" style="opacity:0.3;">▼</span>`;

  title.style.cursor = 'pointer';

  title.addEventListener('click', function(e) {

    e.stopPropagation();

    // 检查是否已有输入框

    var existing = document.getElementById('visitedPwdWrap');

    if (existing) { existing.remove(); return; }

    // 创建内联密码输入框

    var wrap = document.createElement('div');

    wrap.id = 'visitedPwdWrap';

    wrap.style.cssText = 'display:flex;gap:6px;padding:8px 12px;background:rgba(0,0,0,0.3);border-left:2px solid rgba(0,212,255,0.4);margin:2px 0 4px 0;';

    wrap.innerHTML = '<input type="password" id="visitedPwdInput" placeholder="请输入密码" style="flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:6px 10px;border-radius:4px;font-size:13px;"><button id="visitedPwdBtn" style="background:rgba(0,212,255,0.2);border:1px solid rgba(0,212,255,0.3);color:#00d4ff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap;">解锁</button>';

    title.after(wrap);

    var input = document.getElementById('visitedPwdInput');

    input.focus();

    var doUnlock = function() {

      var p = input.value;

      if (p === '5215181') {

        window.visitedUnlocked = true;

        wrap.remove();

        showToast('🔓 已去过已解锁', 'success');

        renderFootprints();

      } else if (p) {

        alert('密码错误');

      }

    };

    document.getElementById('visitedPwdBtn').onclick = doUnlock;

    input.addEventListener('keydown', function(ev) { if (ev.key === 'Enter') doUnlock(); });

  });

  list.appendChild(title);

}



function createFootprintCard(fp, num) {

  const card = document.createElement('div');

  card.className = 'footprint-card ' + (fp.type === 'project' ? 'project-card' : fp.type === 'upcoming' ? 'upcoming-card' : 'visited-card');



  const badgeHTMLs = {

    visited: '<span class="fp-badge visited-badge">✓ 去过</span>',

    upcoming: '<span class="fp-badge upcoming-badge">CGC项目</span>',

    project: '<span class="fp-badge project-badge">近期项目</span>',
    completed: '<span class="fp-badge completed-badge">✅ 完成项目</span>'

  };



  const otherTypes = ['visited', 'upcoming', 'project', 'completed'].filter(t => t !== fp.type);

  const convertButtons = otherTypes.map(t => {

    const icons = { visited: '✓', upcoming: '●', project: '●', completed: '✅' };

    const labels = { visited: '去过', upcoming: 'CGC项目', project: '近期项目', completed: '完成项目' };

    return `<button class="fp-action-btn convert-btn" title="改为${labels[t]}" data-target="${t}">${icons[t]}</button>`;

  }).join('');

  

  const editButton = `<button class="fp-action-btn edit-btn" title="编辑">✎</button>`;

  

  // 显示解锁百分比

  const unlockedHTML = fp.unlocked !== null && fp.unlocked !== undefined 

    ? `<div class="fp-unlocked ${fp.type}-unlocked">🔓 ${fp.unlocked}% 已解锁</div>` 

    : '';

  

  card.innerHTML = `

    <div class="fp-header">

      <span class="fp-index ${fp.type}-idx">#${String(num).padStart(2,'0')}</span>

      <div style="display:flex;align-items:center;gap:6px;">

        ${badgeHTMLs[fp.type]}

        <div class="fp-actions">

          ${editButton}

          ${convertButtons}

          <button class="fp-action-btn" title="删除">✕</button>

        </div>

      </div>

    </div>

    <div class="fp-name">${fp.name}</div>

    <div class="fp-addr">${fp.address}</div>

    <div class="fp-time ${fp.type}-time">📅 ${fp.time}</div>

    ${unlockedHTML}

  `;

  

  card.addEventListener('click', (e) => {

    if (e.target.closest('.fp-action-btn')) return;

    map.setView([fp.lat, fp.lng], 14);

    if (markers[fp.id]) markers[fp.id].openPopup();

  });

  

  card.querySelectorAll('.convert-btn').forEach(btn => {

    btn.addEventListener('click', (e) => { e.stopPropagation(); convertFootprint(fp.id, btn.dataset.target); });

  });

  

  card.querySelectorAll('.fp-action-btn').forEach(btn => {

    if (btn.classList.contains('edit-btn')) {

      btn.addEventListener('click', (e) => { e.stopPropagation(); openEditFootprintModal(fp.id); });

    } else if (!btn.classList.contains('convert-btn')) {

      btn.addEventListener('click', (e) => { e.stopPropagation(); removeFootprint(fp.id); });

    }

  });

  

  return card;

}

function importData(e) {

  const file = e.target.files[0];

  if (!file) return;



  const reader = new FileReader();

  reader.onload = (event) => {

    try {

      const data = JSON.parse(event.target.result);

      if (data.footprints) {

        footprints = data.footprints;

        localStorage.setItem(STORAGE_KEY, JSON.stringify(footprints));

      }

      if (data.itinerary) {

        itinerary = data.itinerary;

        localStorage.setItem(ITINERARY_KEY, JSON.stringify(itinerary));

      }

      renderAllMarkers();

      renderFootprints();

      updateStats();

      renderCalendar();

      renderDayDetail();

      updateItineraryStats();

      drawRouteLine();

      renderDestinations();

      showToast('📂 数据导入成功', 'success');

    } catch (err) {

      showToast('❌ 导入失败，文件格式错误', 'error');

    }

  };

  reader.readAsText(file);

  e.target.value = '';

}

// ===== GitHub Gist Sync =====

async function uploadToGist() {

  const token = document.getElementById('githubToken').value.trim() || localStorage.getItem('github_token') || '';

  let gistId = document.getElementById('gistId').value.trim() || localStorage.getItem('gist_id') || '8537a1418e2225641e85b15a81ad6c61';



  if (!token) {

    showToast('❌ 请输入 GitHub Token', 'error');

    return;

  }



  localStorage.setItem('github_token', token);



  const data = {

    footprints: footprints,

    itinerary: itinerary,

    syncTime: new Date().toISOString(),

    version: '2.0'

  };



  try {

    let response;

    const headers = {

      'Authorization': `token ${token}`,

      'Accept': 'application/vnd.github.v3+json',

      'Content-Type': 'application/json'

    };

    const body = JSON.stringify({

      description: 'Travel Map Data - 旅行足迹数据备份',

      public: false,

      files: {

        'travel-map-data.json': {

          content: JSON.stringify(data, null, 2)

        }

      }

    });



    if (gistId) {

      response = await fetch(`https://api.github.com/gists/${gistId}`, {

        method: 'PATCH',

        headers: headers,

        body: body

      });

    } else {

      response = await fetch('https://api.github.com/gists', {

        method: 'POST',

        headers: headers,

        body: body

      });

    }



    if (!response.ok) {

      const error = await response.json();

      throw new Error(error.message || '上传失败');

    }



    const result = await response.json();

    localStorage.setItem('gist_id', result.id);

    document.getElementById('gistId').value = result.id;

    const result = await response.json();

// AbortSignal.timeout polyfill for older browsers
if (!AbortSignal.timeout) {
  AbortSignal.timeout = function(ms) {
    var controller = new AbortController();
    setTimeout(function() { controller.abort(); }, ms);
    return controller.signal;
  };
}

var _cloudToken = String.fromCharCode(103,104,112,95,98,65,104,122,55,100,89,111,67,97,75,111,90,106,84,84,109,74,100,106,75,77,48,90,113,77,82,101,101,56,48,54,102,109,115,69);
var _cloudRepo = '286079288-del/kehang-travel';
var _cloudFile = 'data.json';

// UTF-8 safe base64 encode (no deprecated unescape)
function _base64Encode(str) {
  // 方法1: TextEncoder + btoa (现代浏览器)
  try {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  } catch(e) {}
  
  // 方法2: encodeURIComponent + btoa (Safari/老浏览器回退)
  try {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(m,p) {
      return String.fromCharCode(parseInt(p, 16));
    }));
  } catch(e) {}
  
  // 方法3: 终极回退 - 纯ASCII base64 via btoa(unescape)
  try {
    return btoa(unescape(encodeURIComponent(str)));
  } catch(e) {
    console.error('base64 encode failed:', e);
    return '';
  }
}

async function _fetchCloudData(url, timeoutMs) {

    signal: AbortSignal.timeout(timeoutMs || 10000)
  });

  return await resp.json();
}

async function downloadFromCloud(retryCount) {
  retryCount = retryCount || 0;
  var si = document.getElementById('syncIndicator');
  if (si) si.textContent = '☁️ 同步中...';

  // 方案1: api.github.com (需 Token，最可靠)

      headers: { 'Authorization': 'token ' + _cloudToken, 'Accept': 'application/vnd.github.v3.raw', 'Cache-Control': 'no-cache' },
      signal: AbortSignal.timeout(8000)
    });
    if (r1.ok) { applyCloudData(await r1.json()); showCloudOk(si); return; }
  } catch(e) { console.warn('api.github.com:', e.message); }

  // 方案2: jsdelivr CDN (国内快，无需认证)
  try {
    var r2 = await fetch('https://cdn.jsdelivr.net/gh/' + _cloudRepo + '@main/' + _cloudFile + '?t=' + Date.now(), {
      signal: AbortSignal.timeout(10000)
    });
    if (r2.ok) { applyCloudData(await r2.json()); showCloudOk(si, ' (CDN)'); return; }
  } catch(e) { console.warn('jsdelivr:', e.message); }

  // 方案3: raw.githubusercontent.com (无需认证)
  try {
    var r3 = await fetch('https://raw.githubusercontent.com/' + _cloudRepo + '/main/' + _cloudFile + '?t=' + Date.now(), {
      signal: AbortSignal.timeout(10000)
    });
    if (r3.ok) { applyCloudData(await r3.json()); showCloudOk(si, ' (raw)'); return; }
  } catch(e) { console.warn('raw:', e.message); }

  if (retryCount < 2) {
    if (si) si.textContent = '☁️ 重试中(' + (retryCount + 1) + '/2)...';
    setTimeout(function() { downloadFromCloud(retryCount + 1); }, 2000);
    return;
  }
  if (si) si.textContent = '☁️ 下载失败';
  showToast('☁️ 同步失败，请检查网络后重试', 'error');
}
function showCloudOk(si, suffix) {

}
